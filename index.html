<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="description" content="DEAL FINDER - 商品を検索して価格を比較">
<title>DEAL FINDER | 商品検索</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#e6e9ef;--accent:#ff7139;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#101827;color:white;padding:22px 18px 34px}nav,.wrap{max-width:960px;margin:auto}nav{display:flex;align-items:center;justify-content:space-between}nav strong{font-size:21px;letter-spacing:1.5px}nav span{font-size:12px;color:#c5ccda}.hero{max-width:960px;margin:32px auto 0;padding:0 4px}.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.15;margin:0 0 10px}.hero p{color:#c5ccda;margin:0 0 22px}.search{display:flex;gap:9px;background:white;padding:7px;border-radius:15px;max-width:740px;box-shadow:0 8px 28px #0002}.search input{flex:1;min-width:0;border:0;outline:0;padding:13px;font-size:16px;color:#172033}.search button{border:0;border-radius:11px;background:var(--accent);color:white;font-weight:700;padding:0 23px;font-size:15px}.wrap{padding:24px 16px 60px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 16px}.toolbar h2{font-size:18px;margin:0}.toolbar select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px;color:var(--ink)}#status{color:var(--muted);font-size:14px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.item{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.photo{height:190px;background:#fff;display:grid;place-items:center;padding:12px}.photo img{max-width:100%;max-height:100%;object-fit:contain}.details{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}.name{font-size:14px;line-height:1.5;font-weight:650;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:63px}.price{font-size:22px;font-weight:800}.seller{font-size:12px;color:var(--muted)}.buy{display:block;text-align:center;text-decoration:none;background:#172033;color:white;border-radius:9px;padding:10px;font-size:13px;font-weight:700;margin-top:auto}.empty{background:white;border:1px dashed #ccd2dd;border-radius:14px;padding:35px 18px;text-align:center;color:var(--muted);grid-column:1/-1}.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:30px}.hidden{display:none!important}button:disabled{opacity:.6}@media(max-width:520px){header{padding:18px 15px 28px}.search button{padding:0 15px}.photo{height:160px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.details{padding:10px}.name{font-size:13px;min-height:58px}.price{font-size:18px}}
</style></head>
<body>
<header><nav><strong>DEAL FINDER</strong><span>SEARCH · COMPARE · DISCOVER</span></nav><section class="hero"><h1>欲しい商品を、<br>もっと簡単に。</h1><p>キーワードで検索して、商品と価格をチェック。</p><form class="search" id="searchForm"><input id="query" type="search" placeholder="商品名・キーワードを入力" maxlength="100" required><button id="searchButton">検索</button></form></section></header>
<main class="wrap"><div class="toolbar"><h2>商品検索結果</h2><select id="sort" aria-label="並び替え"><option value="asc">価格が安い順</option><option value="desc">価格が高い順</option></select></div><p id="status">商品名を入力して検索してください。</p><section class="grid" id="results"><div class="empty">検索すると商品がここに表示されます。</div></section><p class="foot">商品情報・価格はYahoo!ショッピングの検索結果をもとに表示します。価格や在庫、送料などは販売ページで必ずご確認ください。掲載内容は変更される場合があります。</p></main>
<script>
const form=document.querySelector('#searchForm'),query=document.querySelector('#query'),button=document.querySelector('#searchButton'),statusEl=document.querySelector('#status'),results=document.querySelector('#results'),sort=document.querySelector('#sort');let current=[];
function yen(v){const n=Number(v);return Number.isFinite(n)?'¥'+n.toLocaleString('ja-JP'):'価格不明'}
function render(){const arr=[...current].sort((a,b)=>sort.value==='asc'?a.price-b.price:b.price-a.price);results.innerHTML='';if(!arr.length){results.innerHTML='<div class="empty">商品が見つかりませんでした。別のキーワードで試してください。</div>';return}for(const p of arr){const card=document.createElement('article');card.className='item';const photo=document.createElement('div');photo.className='photo';if(p.image){const img=document.createElement('img');img.src=p.image;img.alt=p.name;img.loading='lazy';img.onerror=()=>img.remove();photo.append(img)}else photo.textContent='画像なし';const details=document.createElement('div');details.className='details';const name=document.createElement('div');name.className='name';name.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=yen(p.price);const seller=document.createElement('div');seller.className='seller';seller.textContent=p.seller?'販売店：'+p.seller:'Yahoo!ショッピング';const link=document.createElement('a');link.className='buy';link.href=p.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='販売ページを見る';details.append(name,price,seller,link);card.append(photo,details);results.append(card)}}
form.addEventListener('submit',async e=>{e.preventDefault();const q=query.value.trim();if(!q)return;button.disabled=true;button.textContent='検索中…';statusEl.textContent='Yahoo!ショッピングの商品を検索しています…';results.innerHTML='';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw new Error(data.error||'検索に失敗しました');current=data.items||[];statusEl.textContent=`「${q}」の検索結果：${current.length}件（Yahoo!ショッピング）`;render()}catch(err){current=[];statusEl.textContent=err.message;results.innerHTML='<div class="empty">検索できませんでした。時間をおいて再度お試しください。</div>'}finally{button.disabled=false;button.textContent='検索'}});
sort.addEventListener('change',render);
</script></body></html>
